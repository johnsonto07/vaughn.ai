<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>vaughn.ai</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section id="intro-view" class="intro-view" aria-label="vaughn.ai intro">
        <div class="intro-card">
          <div class="photo-placeholder" aria-label="Vaughn photo placeholder">
            <span>Photo</span>
          </div>
          <div class="intro-copy">
            <h1>vaughn.ai</h1>
            <p>
              Placeholder description for Vaughn. Add the real description here when you send it over.
            </p>
            <button id="start-chat" type="button">Next</button>
          </div>
        </div>
      </section>

      <section id="chat-view" class="chat-view is-hidden" aria-label="vaughn.ai chat">
        <header class="phone-header">
          <button id="back-button" class="back-button" type="button" aria-label="Back to profile">&lsaquo;</button>
          <div class="contact">
            <div class="contact-avatar">V</div>
            <strong>vaughn.ai</strong>
          </div>
          <div class="header-spacer"></div>
        </header>

        <div id="messages" class="messages" aria-live="polite">
          <article class="message bot">
            <p>Yo, I'm vaughn.ai. Ask me about homework, hoops, dinosaurs, Lord of the Rings, or Mormonism.</p>
          </article>
        </div>

        <form id="chat-form" class="composer">
          <label class="sr-only" for="message-input">Message vaughn.ai</label>
          <textarea id="message-input" name="message" rows="1" placeholder="iMessage" required></textarea>
          <button type="submit">Send</button>
        </form>
      </section>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
